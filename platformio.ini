; G4MEOVER LilyGo T-Dongle S3 — ESP-NOW ukfe_rf-Empfaenger + USB-HID-Penetrator
; ESP32-S3 (natives USB). Reiner WiFi-Satellit (kein 868/SX1262) — die S3-Staerke
; ist die native USB-HID-Injektion. Generisches S3-Target (T-Dongle-kompatibel).
[env:lilygo_t_dongle_s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -D G4MEOVER_LILYGO_RX
    -D ESPNOW_CHANNEL=1            ; muss mit WROOM-Relay uebereinstimmen
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB-CDC (T-Dongle hat keinen UART-Chip)
    -D ARDUINO_USB_MODE=0          ; TinyUSB -> Composite CDC + HID gleichzeitig
    ; --- TFT_eSPI Setup fuer LilyGo T-Dongle S3 (ST7735 80x160) ---
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=80
    -D TFT_HEIGHT=160
    -D ST7735_GREENTAB160x80=1
    -D TFT_MOSI=3
    -D TFT_SCLK=5
    -D TFT_CS=4
    -D TFT_DC=2
    -D TFT_RST=1
    -D TFT_BL=38
    -D TFT_BACKLIGHT_ON=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
board_build.flash_size = 4MB
